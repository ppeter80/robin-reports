<!-- Practeo Admin — Faktúry (cloud verzia: Supabase backend + prihlásenie) -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Practeo Admin — Faktúry</title>
<style>
:root{--bg:#0b0d12;--card:#141821;--line:#252b36;--txt:#e6e9ef;--mut:#8a90a0;--acc:#4c7dff;--grn:#2fbf6b;--red:#e0715f;--gold:#e6c86a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px}
header{background:#0d1017;border-bottom:1px solid var(--line);padding:12px 14px;position:sticky;top:0;z-index:5}
h1{margin:0;font-size:1.05rem;display:flex;align-items:center;gap:8px}
h1 .tag{font-size:.62rem;color:var(--mut);border:1px solid var(--line);padding:2px 6px;border-radius:6px;font-weight:400}
nav{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
nav button{flex:1;min-width:90px;background:#11151d;color:var(--mut);border:1px solid var(--line);padding:9px;border-radius:9px;font-weight:600;cursor:pointer;font-size:.85rem}
nav button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
main{max-width:820px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
label{display:block;font-size:.78rem;color:var(--mut);margin:8px 0 3px}
input,select,textarea{width:100%;background:#0f131a;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:9px;font-size:.9rem;font-family:inherit}
textarea{min-height:52px;resize:vertical}
.row{display:flex;gap:8px;align-items:flex-end}.row>*{flex:1;min-width:0}
input[type=date],input[type=datetime-local]{text-align:left;font-size:.76rem;padding:9px 4px;overflow:hidden}
input[type=date]::-webkit-date-and-time-value,input[type=datetime-local]::-webkit-date-and-time-value{text-align:left;margin:0}
input[type=date]::-webkit-calendar-picker-indicator,input[type=datetime-local]::-webkit-calendar-picker-indicator{margin-left:auto;padding-left:2px}
label{min-height:18px}
button.act{background:var(--acc);color:#fff;border:none;border-radius:9px;padding:11px 14px;font-weight:700;cursor:pointer;font-size:.9rem}
button.ghost{background:#11151d;color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:9px 12px;cursor:pointer;font-size:.85rem}
button.mini{background:none;border:none;color:var(--mut);cursor:pointer;font-size:.85rem;padding:2px 4px}
.mut{color:var(--mut);font-size:.82rem}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:600;font-size:.72rem}
.r{text-align:right}
.pill{display:inline-block;font-size:.68rem;padding:2px 7px;border-radius:20px}
.pill.pd{background:rgba(47,191,107,.15);color:var(--grn)}
.pill.un{background:rgba(224,113,95,.15);color:var(--red)}
.itrow{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.itrow input{font-size:.82rem;padding:7px}
.itrow .d{flex:3}.itrow .q{flex:1}.itrow .p{flex:1.4}.itrow .x{flex:0 0 auto}
.tot{display:flex;justify-content:space-between;padding:5px 0;font-size:.9rem}
.tot.big{font-weight:800;font-size:1.1rem;border-top:1px solid var(--line);margin-top:6px;padding-top:8px}
.help{background:rgba(76,125,255,.08);border:1px solid rgba(76,125,255,.25);border-radius:9px;padding:9px 11px;font-size:.8rem;color:#b9c4e6;margin-bottom:10px}
/* Faktúra na tlač */
#print{display:none}
@media print{
  body{background:#fff}
  header,main,#toast{display:none!important}
  #print{display:block!important;color:#000;font-size:12px;padding:0}
}
#print .inv{color:#000;background:#fff;max-width:800px;margin:0 auto;padding:24px;font-family:Arial,sans-serif}
#print h2{font-size:22px;margin:0 0 2px}
#print .box{border:1px solid #bbb;border-radius:6px;padding:10px;font-size:12px}
#print table{font-size:12px}#print th,#print td{border-bottom:1px solid #ddd;color:#000}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#222836;color:#fff;padding:10px 16px;border-radius:10px;opacity:0;transition:.2s;font-size:.85rem;z-index:20}
#toast.show{opacity:1}
</style>

<header>
  <h1>📊 Practeo Admin <span class="tag">Faktúry · účtovníctvo · cloud</span><span id="syncdot" title="ukladám do cloudu…" style="margin-left:auto;font-size:.6rem;color:var(--gold);opacity:0;transition:.3s">● sync</span><button onclick="logout()" class="mini" style="color:var(--mut);font-size:.72rem">Odhlásiť</button></h1>
  <nav>
    <button id="t-dash" onclick="tab('dash')">📈 Dashboard</button>
    <button id="t-fak" class="on" onclick="tab('fak')">🧾 Faktúry</button>
    <button id="t-new" onclick="tab('new')">➕ Faktúra</button>
    <button id="t-nak" onclick="tab('nak')">🧾 Náklady</button>
    <button id="t-cp" onclick="tab('cp')">✈️ Cest. príkazy</button>
    <button id="t-ces" onclick="tab('ces')">🚗 Kniha jázd</button>
    <button id="t-doh" onclick="tab('doh')">🧑‍🎓 Dohodári</button>
    <button id="t-maj" onclick="tab('maj')">🏢 Majetok</button>
    <button id="t-uct" onclick="tab('uct')">📒 Účtovníctvo</button>
    <button id="t-dph" onclick="tab('dph')">💶 DPH</button>
    <button id="t-zml" onclick="tab('zml')">📄 Zmluvy</button>
    <button id="t-cli" onclick="tab('cli')">👥 Klienti</button>
    <button id="t-set" onclick="tab('set')">⚙️ Nastavenia</button>
  </nav>
</header>
<main>
  <div id="s-dash" style="display:none"></div>
  <div id="s-fak"></div>
  <div id="s-new" style="display:none"></div>
  <div id="s-nak" style="display:none"></div>
  <div id="s-cp" style="display:none"></div>
  <div id="s-ces" style="display:none"></div>
  <div id="s-doh" style="display:none"></div>
  <div id="s-maj" style="display:none"></div>
  <div id="s-uct" style="display:none"></div>
  <div id="s-dph" style="display:none"></div>
  <div id="s-zml" style="display:none"></div>
  <div id="s-cli" style="display:none"></div>
  <div id="s-set" style="display:none"></div>
</main>
<div id="print"></div>
<div id="toast"></div>
<div id="login" style="display:none;position:fixed;inset:0;background:var(--bg);z-index:50;align-items:center;justify-content:center;padding:20px">
  <div class="card" style="max-width:340px;width:100%">
    <div style="font-size:1.15rem;font-weight:700;margin-bottom:2px">📊 Practeo Admin</div>
    <p class="mut" style="margin:0 0 6px">Prihlás sa do účtovnej appky</p>
    <label>Email</label><input id="lg_email" type="email" autocomplete="username" inputmode="email">
    <label>Heslo</label><input id="lg_pass" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    <div id="lg_err" style="color:var(--red);font-size:.78rem;min-height:16px;margin-top:6px"></div>
    <button class="act" style="width:100%;margin-top:6px" onclick="doLogin()">Prihlásiť sa</button>
    <button class="ghost" style="width:100%;margin-top:8px" onclick="localMode()">Pracovať lokálne (bez cloudu, len v tomto zariadení)</button>
    <p class="mut" style="margin:6px 0 0;font-size:.72rem">Lokálne dáta sa pri ďalšom prihlásení do cloudu prenesú automaticky.</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="paybysquare.bundle.js"></script>
<script>
const $=id=>document.getElementById(id);
// ===== Cloud úložisko (Supabase) — dáta sú v cloude, localStorage slúži ako offline záloha =====
const SB_URL='https://eboaxggsmlbcjsosfjyu.supabase.co';
const SB_KEY='sb_publishable_KRN9iGyNXGLGRru7p_UXRA_7XK3FwZ8';
let sb=null, CACHE={}, _sync={};
function sbInit(){if(!sb)sb=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});return sb}
const LS={
  get:(k,d)=>{const v=CACHE[k];return (v===undefined||v===null)?d:v},
  set:(k,v)=>{CACHE[k]=v;try{localStorage.setItem('practeo_'+k,JSON.stringify(v))}catch(e){}cloudPush(k,v)}
};
async function cloudPush(k,v){
  if(!sb)return;
  _sync[k]=(_sync[k]||0)+1;syncBadge();
  try{const {error}=await sb.from('practeo_data').upsert({key:k,value:v,updated_at:new Date().toISOString()},{onConflict:'key'});if(error)throw error}
  catch(e){toast('⚠️ Cloud: '+(e.message||'nezapísané'))}
  finally{_sync[k]=(_sync[k]||1)-1;syncBadge()}
}
function syncBadge(){const n=Object.values(_sync).reduce((a,b)=>a+Math.max(0,b),0);const el=$('syncdot');if(el)el.style.opacity=n>0?'1':'0'}
async function cloudLoadAll(){const {data,error}=await sb.from('practeo_data').select('key,value');if(error){toast('⚠️ Načítanie zlyhalo');return}CACHE={};(data||[]).forEach(r=>{CACHE[r.key]=r.value})}
async function migrateLocalIfNeeded(){
  const keys=['supplier','clients','invoices','expenses','vehicles','trips','dohodari','assets','counters','cprikazy','rates','firmdocs','uct'];
  if(!keys.every(k=>CACHE[k]===undefined))return;
  let any=false;
  for(const k of keys){const raw=localStorage.getItem('practeo_'+k);if(raw!=null){try{CACHE[k]=JSON.parse(raw);await cloudPush(k,CACHE[k]);any=true}catch(e){}}}
  if(any)toast('Lokálne dáta prenesené do cloudu ✅');
}
function loadGlobals(){
  SUP=LS.get('supplier',SUP);CLI=LS.get('clients',CLI);INV=LS.get('invoices',INV);
  EXP=LS.get('expenses',EXP);VOZ=LS.get('vehicles',VOZ);JAZ=LS.get('trips',JAZ);
  DOH=LS.get('dohodari',DOH);MAJ=LS.get('assets',MAJ);CNT=LS.get('counters',CNT);
  CP=LS.get('cprikazy',CP);RATES=LS.get('rates',null)||RATES;FD=LS.get('firmdocs',FD);UCT=LS.get('uct',UCT);
}
function localMode(){sb=null;CACHE={};
 ['supplier','clients','invoices','expenses','vehicles','trips','dohodari','assets','counters','cprikazy','rates','firmdocs','uct'].forEach(k=>{const raw=localStorage.getItem('practeo_'+k);if(raw!=null){try{CACHE[k]=JSON.parse(raw)}catch(e){}}});
 $('login').style.display='none';loadGlobals();const tg=document.querySelector('.tag');if(tg)tg.textContent='Faktúry · lokálne';renderFak()}
async function doLogin(){
  const email=$('lg_email').value.trim(),pass=$('lg_pass').value;$('lg_err').textContent='';
  const {error}=await sb.auth.signInWithPassword({email,password:pass});
  if(error){$('lg_err').textContent='Prihlásenie zlyhalo: '+error.message;return}
  await afterAuth();
}
async function afterAuth(){$('login').style.display='none';await cloudLoadAll();await migrateLocalIfNeeded();loadGlobals();renderFak()}
async function logout(){try{await sb.auth.signOut()}catch(e){}location.reload()}
async function init(){
  sbInit();
  try{const {data:{session}}=await sb.auth.getSession();if(session){await afterAuth();return}}catch(e){}
  $('login').style.display='flex';
}
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const eur=n=>(Math.round((+n||0)*100)/100).toLocaleString('sk-SK',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}
let _uidLast=0;function uid(){let t=Date.now();if(t<=_uidLast)t=_uidLast+1;_uidLast=t;return t} // monotónne unikátne ID (žiadne kolízie pri rýchlom vytváraní)
// režimy DPH (2026): 23 základná, 19 a 5 znížené, oslobodené (§38 prenájom), reverse charge
const DPHM={
 none:{r:0,lbl:'Neplatiteľ (bez DPH)'},
 sk23:{r:0.23,lbl:'SK 23 % — základná'},
 sk:{r:0.23,lbl:'SK 23 %'},
 sk5:{r:0.05,lbl:'SK 5 % — ubytovanie'},
 sk19:{r:0.19,lbl:'SK 19 % — znížená'},
 exempt:{r:0,lbl:'Oslobodené §38 (nájom)'},
 rc:{r:0,lbl:'Reverse charge (ČR/EÚ)'}
};
function dphNote(m){
 if(m==='rc')return'Prenesenie daňovej povinnosti — Reverse charge. Daň odvedie príjemca (čl. 196 smernice Rady 2006/112/ES). Miesto dodania podľa § 15 ods. 1 zákona o DPH.';
 if(m==='exempt')return'Oslobodené od dane podľa § 38 zákona o DPH (nájom nehnuteľnosti).';
 if(m==='none')return'Dodávateľ nie je platiteľom DPH.';
 return'';
}

// ---- default dodávateľ (Practeo) ----
let SUP=LS.get('supplier',{meno:'Practeo, s.r.o.',sidlo:'SNP 1786/72, 069 01 Snina',ico:'',dic:'',icdph:'',iban:'',konatel:'Ing. Peter Pčola'});
let CLI=LS.get('clients',[]);
let INV=LS.get('invoices',[]);
let EXP=LS.get('expenses',[]);
const KAT=['Nájom / sídlo','Účtovníctvo / právne','Technika a softvér / AI','Auto / PHM / servis','Telefón / internet','Cestovné / diéty','Marketing / web','Vzdelávanie / knihy','Poistenie','Bankové poplatky','Materiál / kancelária','Nehnuteľnosti (náklady)','Ostatné'];
const VRATE={none:0,'23':0.23,'5':0.05,'19':0.19};
let VOZ=LS.get('vehicles',[]);
let JAZ=LS.get('trips',[]);
let DOH=LS.get('dohodari',[]);
let MAJ=LS.get('assets',[]);
let CP=LS.get('cprikazy',[]);
let RATES=LS.get('rates',null)||defaultRates();
let FD=LS.get('firmdocs',{}); // firemné doklady (rozhodnutie spoločníka o náhradách…)
const ODS={1:{r:4,d:'1 – 4 roky (autá, motorky, PC, technika)'},2:{r:6,d:'2 – 6 rokov (nábytok, stroje)'},3:{r:8,d:'3 – 8 rokov'},4:{r:12,d:'4 – 12 rokov'},5:{r:20,d:'5 – 20 rokov (priemyselné budovy)'},6:{r:40,d:'6 – 40 rokov (admin/bytové budovy)'}};
function majOdpis(m){const c=+m.cena||0;if(c<=1700)return{rocny:c,roky:1,drobny:true};const roky=(ODS[m.sk]||ODS[1]).r;return{rocny:c/roky,roky,drobny:false}}
const NCZD_M=5966.73/12;   // mesačná nezdaniteľná časť
function dohCalc(d){
 const o=+d.odmena||0;let ee=0,er=0,danZ;
 if(d.typ==='iný'){ee=o*0.134;er=o*0.352;danZ=Math.max(0,o-ee-NCZD_M);}
 else{const oop=d.oop!==false;const z=oop?Math.max(0,o-200):o;ee=z*0.07;er=o*0.0105+z*0.2175;
   danZ=(d.typ==='dôchodca')?Math.max(0,o-ee):Math.max(0,o-ee-NCZD_M);}
 const dan=danZ*0.19;return{o,ee,dan,cista:o-ee-dan,er,naklad:o+er};
}
const KMRATE=0.313;                 // základná náhrada €/km (2026)
function dietaFor(h){if(h==null||h<5)return 0;if(h<=12)return 9.30;if(h<=18)return 13.80;return 20.60} // tuzemské stravné od 1. 12. 2025 (oznámenie MPSVR 280/2025)
function tripHours(od,pr){if(!od||!pr)return null;const a=new Date(od),b=new Date(pr);const h=(b-a)/3600000;return h>0?h:null}

let cur=null; // rozpracovaná faktúra
// Číslovanie: perzistentné počítadlá podľa typu (číslo sa nikdy nepoužije 2x → žiadne duplikáty)
let CNT=LS.get('counters',{F:0,Z:0,D:0});
const TYPPFX={'faktúra':'F','zálohová':'Z','dobropis':'D'};
const TYPLBL={'faktúra':'FAKTÚRA','zálohová':'ZÁLOHOVÁ FAKTÚRA','dobropis':'DOBROPIS'};
function peekNo(typ){const k=TYPPFX[typ]||'F';return `${k}${new Date().getFullYear()}${String((CNT[k]||0)+1).padStart(3,'0')}`}
function nextNo(typ){const k=TYPPFX[typ]||'F';CNT[k]=(CNT[k]||0)+1;LS.set('counters',CNT);return `${k}${new Date().getFullYear()}${String(CNT[k]).padStart(3,'0')}`}

function tab(t){for(const k of ['dash','fak','new','nak','cp','ces','doh','maj','uct','dph','zml','cli','set']){$('s-'+k).style.display=k===t?'':'none';$('t-'+k).classList.toggle('on',k===t)}
 if(t==='dash')renderDash();if(t==='fak')renderFak();if(t==='new')renderNew();if(t==='nak')renderNak();if(t==='cp')renderCP();if(t==='ces')renderCes();if(t==='doh')renderDoh();if(t==='maj')renderMaj();if(t==='uct')renderUct();if(t==='dph')renderDph();if(t==='zml')renderZml();if(t==='cli')renderCli();if(t==='set')renderSet()}

// ===== NASTAVENIA =====
function renderSet(){
 $('s-set').innerHTML=`<div class="card"><b>Údaje dodávateľa (Practeo)</b><p class="mut">Zobrazia sa na každej faktúre. Doplň IČO/DIČ/IČ DPH/IBAN po zápise.</p>
 <label>Obchodné meno</label><input id="su_meno" value="${esc(SUP.meno)}">
 <label>Sídlo</label><input id="su_sidlo" value="${esc(SUP.sidlo)}">
 <div class="row"><div><label>IČO</label><input id="su_ico" value="${esc(SUP.ico)}"></div><div><label>DIČ</label><input id="su_dic" value="${esc(SUP.dic)}"></div></div>
 <div class="row"><div><label>IČ DPH</label><input id="su_icdph" value="${esc(SUP.icdph)}" placeholder="SK..."></div><div><label>IBAN</label><input id="su_iban" value="${esc(SUP.iban)}"></div></div>
 <label>Konateľ</label><input id="su_kon" value="${esc(SUP.konatel)}">
 <div style="margin-top:12px"><button class="act" onclick="saveSup()">Uložiť</button></div></div>
 <div class="card"><b>📁 Firemné doklady</b><p class="mut">Jednorazové doklady, ktoré účtovník potrebuje k cestovným náhradám.</p>
  <div class="box" style="display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap"><span style="font-size:.82rem">${FD.rozhodnutie?'✅':'⚠️'} Rozhodnutie jediného spoločníka o cestovných náhradách konateľa (§ 1 ods. 2 zák. 283/2002)</span><span>${FD.rozhodnutie?docBtn(FD.rozhodnutie,"docView(FD.rozhodnutie)")+`<button class="mini" onclick="delFirmDoc('rozhodnutie')">✕</button>`:`<button class="ghost" style="padding:4px 10px;font-size:.8rem" onclick="this.nextElementSibling.click()">📎 nahrať</button><input type="file" accept="image/*,application/pdf" style="display:none" onchange="setFirmDoc('rozhodnutie',this)">`}</span></div></div>
 <div class="card"><b>📤 Export pre účtovníka</b><p class="mut">Stiahni prehľady a pošli účtovníkovi.</p>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="ghost" onclick="exportFakCSV()">🧾 Faktúry (CSV)</button><button class="ghost" onclick="exportNakCSV()">💸 Náklady (CSV)</button><button class="ghost" onclick="exportCPCSV()">✈️ Cestovné príkazy (CSV)</button></div></div>
 <div class="card"><b>💱 Kurzy ECB pre stravné</b><p class="mut">Zákon 283/2002 § 36 ods. 6: kurz ECB platný k 1. dňu mesiaca, v ktorom sa cesta začala (jednotiek meny za 1 €, ecb.europa.eu). Doplň pre každý nový mesiac so zahraničnou cestou.</p>
  <div class="row"><div><label>Mesiac</label><input type="month" id="k_m" value="${today().slice(0,7)}"></div><div><label>Mena</label><select id="k_cur">${CP_CURS.map(c=>`<option>${c}</option>`).join('')}</select></div><div><label>Kurz</label><input type="number" step="0.00001" id="k_k" placeholder="0.85655"></div></div>
  <div style="margin-top:6px"><button class="ghost" onclick="addKurz()">Pridať / prepísať kurz</button></div>
  <div style="margin-top:6px">${(RATES.kurzy||[]).slice().sort((a,b)=>a.m===b.m?(a.cur<b.cur?-1:1):(a.m<b.m?1:-1)).map(r=>`<div class="mut" style="border-top:1px solid var(--line);padding:4px 0">${esc(r.m)} · ${esc(r.cur)} · ${r.k} <button class="mini" onclick="delKurz('${esc(r.m)}','${esc(r.cur)}')">✕</button></div>`).join('')}</div>
  <p class="mut" style="margin-top:8px">Sadzby stravného: ${CP_COUNTRIES.filter(c=>c.s).map(c=>esc(c.k)+' '+c.s+' '+c.cur).join(' · ')} (opatrenie MF SR č. 401/2012 Z. z.); tuzemsko 9,30 / 13,80 / 20,60 € (od 1. 12. 2025); auto ${KMRATE.toFixed(3)} €/km.</p></div>
 <div class="card"><b>💾 Záloha dát</b><p class="mut">Dáta sú v cloude (Supabase) a synchronizujú sa automaticky medzi zariadeniami. JSON záloha nižšie je navyše, na stiahnutie do počítača.</p>

  ${cur.typ==='zálohová'?'<div class="help">Zálohová faktúra je výzva na úhradu — NIE je daňový doklad. Po zaplatení vystavíš riadnu faktúru.</div>':''}

  ${cur.typ==='faktúra'&&INV.some(z=>z.typ==='zálohová'&&!z.draft)?`<div><label>Zúčtovať zálohovú faktúru (účtovníctvo 324/311)</label><select id="f_zal" onchange="cur.zal=this.value||null"><option value="">— žiadna —</option>${INV.filter(z=>z.typ==='zálohová'&&!z.draft).map(z=>`<option value="${z.id}" ${String(cur.zal||'')===String(z.id)?'selected':''}>${esc(z.no)} · ${eur(totals(z).total)}${z.paid?'':' (nezaplatená)'}</option>`).join('')}</select></div>`:''}
  <div class="row"><div><label>Dátum vystavenia</label><input type="date" id="f_dvyst" value="${cur.dvyst}"></div>
  <div><label>Dátum dodania</label><input type="date" id="f_ddod" value="${cur.ddod}"></div>
  <div><label>Splatnosť</label><input type="date" id="f_dspl" value="${cur.dspl}"></div></div>
  <label>Režim DPH</label>
  <select id="f_dph" onchange="cur.dph=this.value;renderNew()">
    ${['none','sk23','sk5','sk19','exempt','rc'].map(k=>`<option value="${k}" ${cur.dph===k||(cur.dph==='sk'&&k==='sk23')?'selected':''}>${DPHM[k].lbl}</option>`).join('')}
  </select>
  ${cur.dph==='rc'?'<div class="help">Bez DPH — prenesenie daňovej povinnosti. Uveď IČ DPH klienta.</div>':''}
  ${cur.dph==='exempt'?'<div class="help">Bez DPH — oslobodené (§38, dlhodobý nájom nehnuteľnosti). Pozn.: krátkodobé ubytovanie NIE je oslobodené — použi 5 %.</div>':''}
  ${cur.dph==='sk5'?'<div class="help">Znížená sadzba 5 % — ubytovacie služby / krátkodobý (apartmánový) prenájom.</div>':''}

  <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">

}
function drawItems(){$('f_items').innerHTML=cur.items.map((it,i)=>`<div class="itrow">
 <input class="d" placeholder="Popis položky" value="${esc(it.d)}" oninput="cur.items[${i}].d=this.value">
 <input class="q" type="number" step="0.01" value="${it.q}" oninput="cur.items[${i}].q=+this.value;drawTot()">
 <input class="p" type="number" step="0.01" placeholder="cena/j." value="${it.p}" oninput="cur.items[${i}].p=+this.value;drawTot()">
 <button class="mini x" onclick="cur.items.splice(${i},1);renderNew()">✕</button></div>`).join('')}
function syncItems(){}
function totals(inv){const base=inv.items.reduce((s,it)=>s+(+it.q||0)*(+it.p||0),0);const rate=(DPHM[inv.dph]||{}).r||0;const dph=base*rate;return{base,dph,total:base+dph,rate}}
function drawTot(){const t=totals(cur);$('f_tot').innerHTML=`<div class="tot"><span>Základ</span><b>${eur(t.base)}</b></div>${t.rate>0?`<div class="tot"><span>DPH ${Math.round(t.rate*100)} %</span><b>${eur(t.dph)}</b></div>`:''}<div class="tot big"><span>Spolu</span><span>${eur(t.total)}</span></div>`}
function saveInv(issue){cur.typ=$('f_typ').value;if($('f_ref'))cur.ref=$('f_ref').value;
 if(cur.cli==null){toast('Vyber klienta');return}if(!cur.items.some(it=>it.d)){toast('Pridaj aspoň 1 položku');return}
 cur.draft=!issue;
 if(issue){cur.no=$('f_no').value.trim();if(!cur.no)cur.no=nextNo(cur.typ);}else{cur.no='';}
 const ex=INV.findIndex(i=>i.id===cur.id);if(!cur.id)cur.id=uid();
 if(ex>=0)INV[ex]=cur;else INV.unshift(cur);LS.set('invoices',INV);toast(issue?((TYPLBL[cur.typ]||'Doklad')+' vystavený ✅'):'Návrh uložený 📝');cur=null;tab('fak')}
function issueDraft(id){const i=INV.find(x=>x.id===id);if(!i)return;if(!confirm('Vystaviť naostro? Pridelí sa reálne číslo a doklad sa stane daňovým dokladom.'))return;i.draft=false;i.no=nextNo(i.typ);LS.set('invoices',INV);renderFak();toast('Vystavené ✅ č. '+i.no)}

// ===== ZOZNAM FAKTÚR =====
function renderFak(){
 let h='';
 if(!SUP.ico)h+='<div class="help">Tip: v ⚙️ Nastaveniach doplň IČO/DIČ/IČ DPH/IBAN Practeo — po zápise firmy.</div>';
 const paid=INV.filter(i=>i.paid&&!i.draft).reduce((s,i)=>s+totals(i).total,0);
 const unpaid=INV.filter(i=>!i.paid&&!i.draft).reduce((s,i)=>s+totals(i).total,0);
 const nDraft=INV.filter(i=>i.draft).length;
 h+=`<div class="card"><div class="row"><div><div class="mut">Vystavené</div><b>${INV.filter(i=>!i.draft).length}</b>${nDraft?` <span class="mut">+${nDraft} návrh</span>`:''}</div><div><div class="mut">Zaplatené</div><b style="color:var(--grn)">${eur(paid)}</b></div><div><div class="mut">Nezaplatené</div><b style="color:var(--red)">${eur(unpaid)}</b></div></div></div>`;
 h+='<div class="card"><b>Faktúry</b>';
 if(!INV.length)h+='<p class="mut">Zatiaľ žiadne. Vytvor v „➕ Faktúra".</p>';
 else{h+='<table><thead><tr><th>Číslo</th><th>Klient</th><th class="r">Suma</th><th></th></tr></thead><tbody>';
 INV.forEach(i=>{const c=CLI[i.cli];const pill=i.draft?'<span class="pill" style="background:rgba(230,200,106,.15);color:var(--gold)">návrh</span>':`<span class="pill ${i.paid?'pd':'un'}">${i.paid?'zaplatená':'nezaplatená'}</span>`;
  h+=`<tr><td>${i.draft?'<span class="mut">NÁVRH</span>':esc(i.no)}<br><span class="mut">${esc(i.dvyst)}</span></td><td>${esc(c?c.meno:'—')}<br>${pill}${i.paid&&!i.draft?`<br><input type="date" value="${esc(i.dpaid||'')}" title="dátum úhrady (účtovníctvo)" style="width:auto;font-size:.72rem;padding:3px 4px;margin-top:3px" onchange="setPaidDate(${i.id},this.value)">`:''}</td><td class="r"><b>${eur(totals(i).total)}</b></td>
 <td class="r"><button class="mini" onclick="previewInv(INV.find(x=>x.id===${i.id}))">👁️</button><button class="mini" onclick="editInv(${i.id})">✏️</button>${i.draft?`<button class="mini" onclick="issueDraft(${i.id})" title="Vystaviť naostro">✅</button>`:`<button class="mini" onclick="togglePaid(${i.id})">${i.paid?'↺':'✓'}</button>`}<button class="mini" onclick="delInv(${i.id})">✕</button></td></tr>`});
 h+='</tbody></table>'}
 h+='</div>';$('s-fak').innerHTML=h;
}
function editInv(id){cur=JSON.parse(JSON.stringify(INV.find(i=>i.id===id)));tab('new')}
function togglePaid(id){const i=INV.find(x=>x.id===id);i.paid=!i.paid;i.dpaid=i.paid?today():null;LS.set('invoices',INV);renderFak()}
function setPaidDate(id,v){const i=INV.find(x=>x.id===id);if(!i)return;i.dpaid=v||null;LS.set('invoices',INV)}
function delInv(id){if(!confirm('Zmazať tento doklad?\n\nČíslo sa už znova nepoužije (žiadne duplikáty). Pri už odoslanej/zaúčtovanej faktúre je správnejšie vystaviť DOBROPIS (storno) než mazať — číslovanie má byť súvislé.'))return;INV=INV.filter(i=>i.id!==id);LS.set('invoices',INV);renderFak()}

function parseDoklad(t){

const CP_COUNTRIES=[ // zahraničné sadzby: opatrenie MF SR č. 401/2012 Z. z. (UK overené 8. 10. 2026, ostatné 22. 9. 2026)
 {k:'Slovensko (tuzemsko)',cur:'EUR',s:0},{k:'Spojené kráľovstvo',cur:'GBP',s:37},{k:'Česko',cur:'CZK',s:600},

const CP_KRAT={r:0.25,o:0.40,v:0.35}; // krátenie raňajky/obed/večera (§ 5 ods. 6, § 13 ods. 7)
const CP_CURS=['GBP','CZK','PLN','HUF','USD','CHF'];
function defaultRates(){return{kurzy:[ // ECB referenčné kurzy k 1. dňu mesiaca (§ 36 ods. 6), jednotiek meny za 1 €
 {m:'2026-09',cur:'GBP',k:0.85655},{m:'2026-09',cur:'CZK',k:24.159},{m:'2026-09',cur:'PLN',k:4.3313},{m:'2026-09',cur:'HUF',k:366.71},{m:'2026-09',cur:'USD',k:1.159},{m:'2026-09',cur:'CHF',k:0.9394},
 {m:'2026-10',cur:'GBP',k:0.85373},{m:'2026-10',cur:'CZK',k:24.459},{m:'2026-10',cur:'PLN',k:4.3735},{m:'2026-10',cur:'HUF',k:367.18},{m:'2026-10',cur:'USD',k:1.1298},{m:'2026-10',cur:'CHF',k:0.9437}]}}
function cpKurz(cur,dt){if(cur==='EUR')return 1;const m=(dt||'').slice(0,7);const r=(RATES.kurzy||[]).find(x=>x.cur===cur&&x.m===m);return r?+r.k:null}
function zahrPodiel(h){if(h<=0)return 0;if(h<=6)return .25;if(h<=12)return .5;return 1}
function dKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function cpDays(cp){
 if(!cp.na||!cp.uk)return[];const na=new Date(cp.na),uk=new Date(cp.uk);if(!(uk>na))return[];
 const od=cp.od?new Date(cp.od):na,pr=cp.pr?new Date(cp.pr):uk,tuz=cp.kraj===CP_COUNTRIES[0].k,out=[];
 let d=new Date(na.getFullYear(),na.getMonth(),na.getDate());
 for(let i=0;i<31&&d<=uk;i++){const d1=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1);
  const all=Math.max(0,Math.min(uk,d1)-Math.max(na,d))/3600000;const hz=tuz?0:Math.max(0,Math.min(pr,d1)-Math.max(od,d))/3600000;
  const key=dKey(d),j=(cp.jedla||{})[key]||{};out.push({key,hz,hs:all-hz,r:!!j.r,o:!!j.o,v:!!j.v});d=d1}
 return out}
function cpCalc(cp){
 const c=CP_COUNTRIES.find(x=>x.k===cp.kraj)||CP_COUNTRIES[0];const kurz=cpKurz(c.cur,cp.na);
 const days=cpDays(cp).map(d=>{const kr=(d.r?CP_KRAT.r:0)+(d.o?CP_KRAT.o:0)+(d.v?CP_KRAT.v:0);const pct=zahrPodiel(d.hz);
  const sm=c.s*pct*(1-kr),se=kurz?sm/kurz:0,tz=dietaFor(d.hs)*(1-kr);return Object.assign({},d,{pct,kr,sm,se,tz,spolu:se+tz})});
 const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
 const stravMena=sum(days,d=>d.sm),stravEur=sum(days,d=>d.se),tuzEur=sum(days,d=>d.tz),vyd=cp.vyd||[];
 const vKon=sum(vyd.filter(x=>x.kto==='konateľ'),x=>+x.sum||0),vFir=sum(vyd.filter(x=>x.kto==='firma'),x=>+x.sum||0);
 let auto=0;if(cp.dopr==='auto'){const v=VOZ[cp.voz]||{};const km=+cp.km||0;auto=km*KMRATE+(+v.spot||0)/100*km*(+v.cena||0)}
 const strav=stravEur+tuzEur,naVypl=strav+vKon+auto-(+cp.pred||0);
 return{c,kurz,days,stravMena,stravEur,tuzEur,strav,vKon,vFir,auto,naVypl,naklad:strav+vKon+vFir+auto}}
function cpMissing(cp){const m=[];
 if(!(cp.ucel||'').trim())m.push('účel cesty');if(!cp.kraj)m.push('krajina');if(!(cp.miesto||'').trim())m.push('miesto (mesto)');
 if(!cp.na)m.push('nástup na cestu (dátum a čas)');if(!cp.uk)m.push('ukončenie cesty (dátum a čas)');
 if(cp.na&&cp.uk&&!(new Date(cp.uk)>new Date(cp.na)))m.push('ukončenie musí byť po nástupe');
 if(cp.od&&cp.na&&new Date(cp.od)<new Date(cp.na))m.push('odlet nemôže byť pred nástupom');
 if(cp.pr&&cp.uk&&new Date(cp.pr)>new Date(cp.uk))m.push('prílet nemôže byť po ukončení');
 if(cp.od&&cp.pr&&new Date(cp.pr)<new Date(cp.od))m.push('prílet nemôže byť pred odletom');
 if(cp.na&&cp.uk&&cpDays(cp).length>=31)m.push('cesta dlhšia než 31 dní – rozdeľ ju');
 if(!cp.dopr)m.push('dopravný prostriedok');if(cp.dopr==='auto'&&!(+cp.km>0))m.push('počet km pri ceste autom');
 const c=CP_COUNTRIES.find(x=>x.k===cp.kraj);if(c&&c.cur!=='EUR'&&cp.na&&cpKurz(c.cur,cp.na)==null)m.push('kurz ECB '+c.cur+' k 1. dňu mesiaca '+cp.na.slice(0,7)+' (Nastavenia → Kurzy)');
 (cp.vyd||[]).forEach((x,i)=>{if(!(x.pop||'').trim())m.push('názov výdavku č. '+(i+1));if(!(+x.sum>0))m.push('suma výdavku č. '+(i+1));if(!x.kto)m.push('kto platil výdavok č. '+(i+1))});
 return m}
let curCP=null;
function newCP(){return{id:null,no:'',ucel:'',kraj:CP_COUNTRIES[1].k,miesto:'',na:'',od:'',pr:'',uk:'',dopr:'lietadlo',voz:0,km:0,ubyt:'',pred:0,jedla:{},vyd:[],pozn:''}}
function renderCP(){if(!curCP)curCP=newCP();const cp=curCP;
 const kopt=CP_COUNTRIES.map(c=>`<option ${c.k===cp.kraj?'selected':''}>${esc(c.k)}</option>`).join('');
 const vopt=VOZ.map((v,i)=>`<option value="${i}" ${i==cp.voz?'selected':''}>${esc(v.naz)}</option>`).join('');
 const dopt=['lietadlo','auto','vlak/bus','iné'].map(d=>`<option value="${d}" ${cp.dopr===d?'selected':''}>${d==='auto'?'auto (náhrada za km)':d}</option>`).join('');
 let h=`<div class="card"><b>✈️ ${cp.id?'Úprava cestovného príkazu '+esc(cp.no):'Nový cestovný príkaz'}</b>

function renderDash(){
 const RINV=INV.filter(i=>!i.draft);
 const trzby=RINV.reduce((s,i)=>s+totals(i).base,0);
 const dphOut=RINV.reduce((s,i)=>s+totals(i).dph,0);
 const rcEU=RINV.filter(i=>i.dph==='rc').reduce((s,i)=>s+totals(i).base,0);
 const naklE=EXP.filter(e=>e.uzn).reduce((s,e)=>s+(+e.sum||0),0);
 const nahr=JAZ.reduce((s,j)=>s+nahrada(j).total,0)+CP.reduce((s,c)=>s+cpCalc(c).naklad,0);
 const odp=MAJ.reduce((s,m)=>s+majOdpis(m).rocny,0);
 const naklUzn=naklE+nahr+odp;
 const dphIn=EXP.reduce((s,e)=>{const r=VRATE[e.dph]||0;const t=+e.sum||0;return s+(t-t/(1+r))},0);
 const zisk=trzby-naklUzn;const danPO=Math.max(zisk*0.10,0);const saldo=dphOut-dphIn;
 $('s-dash').innerHTML=openTasksHtml()+`<div class="card"><b>📈 Prehľad</b> <span class="mut">(všetky doklady)</span>
  <div class="tot"><span>Tržby (základ faktúr)</span><b>${eur(trzby)}</b></div>
  <div class="tot"><span>Náklady – doklady</span><b>${eur(naklE)}</b></div>
  <div class="tot"><span>Náklady – cestovné náhrady</span><b>${eur(nahr)}</b></div>
  <div class="tot"><span>Náklady – odpisy majetku (ročne)</span><b>${eur(odp)}</b></div>
  <div class="tot big"><span>Zisk (odhad)</span><span>${eur(zisk)}</span></div>
  <div class="tot"><span>Odhad dane PO (10 %)</span><b>${eur(danPO)}</b></div></div>
  ${(()=>{const per=today().slice(0,7);const D=dphObd(per);const R=D.R;return `<div class="card"><b>💶 DPH – ${per.slice(5,7)}/${per.slice(0,4)}</b> <span class="mut">(zostavuje sa z dokladov)</span>
  <div class="tot"><span>Daň celkom (r. 17)</span><b>${eur(R['17'])}</b></div>
  <div class="tot"><span>Odpočítanie dane (r. 18 + 18a + 19)</span><b>${eur((R['18']||0)+(R['18a']||0)+(R['19']||0))}</b></div>
  <div class="tot big"><span>${R['33']>0?'Nadmerný odpočet (r. 33)':'Vlastná daňová povinnosť (r. 32)'}</span><span>${eur(R['33']>0?R['33']:R['32'])}</span></div>
  <div class="tot" style="margin-top:8px;border-top:1px solid var(--line);padding-top:8px"><span>Súhrnný výkaz – služby do EÚ</span><b>${eur(D.SV.reduce((s,x)=>s+x.v,0))}</b></div>
  ${D.W.length?`<p class="mut" style="margin-top:6px;color:var(--red)">⚠️ ${D.W.length} upozornení</p>`:''}<div style="margin-top:8px"><button class="ghost" onclick="tab('dph')">Otvoriť priznanie, KV a SV →</button></div></div>`})()}`;
}

function dl(name,content,type){const b=new Blob([content],{type:type||'text/plain;charset=utf-8'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function csvEsc(v){v=String(v==null?'':v);return /[",;\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}

function uctE(dat,dok,pop,md,d,suma,src,sid,extra){suma=Math.round((+suma||0)*100)/100;if(!suma)return null;if(suma<0){const t=md;md=d;d=t;suma=-suma}return Object.assign({dat:(dat||'').slice(0,10),dok:dok||'',pop,md,d,suma,src,sid},extra||{})}
function uctLastDay(y,m){return y+'-'+String(m).padStart(2,'0')+'-'+String(new Date(y,m,0).getDate()).padStart(2,'0')}

 // počiatočné stavy
 if(UCT.psRok)(UCT.ps||[]).forEach((p,i)=>{const md=+p.md||0,d=+p.d||0;if(md)push(uctE(UCT.psRok+'-01-01','PS','Počiatočný stav '+p.ucet,p.ucet,'701',md,'ps',i));if(d)push(uctE(UCT.psRok+'-01-01','PS','Počiatočný stav '+p.ucet,'701',p.ucet,d,'ps',i))});
 // faktúry (len vystavené, nie návrhy)
 INV.filter(i=>!i.draft&&i.no).forEach(i=>{const t=totals(i);const c=CLI[i.cli]||{};const who=c.meno?' – '+c.meno:'';
  if(i.typ==='zálohová'){if(i.paid)push(uctE(i.dpaid||i.dvyst,i.no,'Úhrada zálohovej faktúry '+i.no+who,'221','324',t.total,'inv',i.id));return}
  const lbl=i.typ==='dobropis'?'Dobropis ':'Faktúra ';
  push(uctE(i.dvyst,i.no,lbl+i.no+who,'311','602',t.base,'inv',i.id));
  if(t.dph)push(uctE(i.dvyst,i.no,'DPH '+Math.round(t.rate*100)+' % '+i.no,'311','343',t.dph,'inv',i.id));
  let zal=0;if(i.zal){const z=INV.find(x=>x.id===+i.zal);if(z){zal=Math.min(totals(z).total,t.total);push(uctE(i.dvyst,i.no,'Zúčtovanie zálohy '+z.no+' k '+i.no,'324','311',zal,'inv',i.id))}}
  if(i.paid)push(uctE(i.dpaid||i.dvyst,i.no,'Úhrada '+i.no+who,'221','311',t.total-zal,'inv',i.id,{odhad:!i.dpaid}))});
 // náklady
 EXP.forEach(x=>{const tot=+x.sum||0;if(!tot)return;const uc=x.ucet||KAT_UCET[x.kat]||'548';const r=VRATE[x.dph]||0;const pl=x.plat||'221';
  const odp=r>0&&SUP.dphOd&&x.dat>=SUP.dphOd;const base=odp?tot/(1+r):tot;const dph=tot-base;const pop=(x.dod||'')+(x.pop?' – '+x.pop:'')+(x.uzn===false?' (nedaňový)':'');
  push(uctE(x.dat,'ND'+String(x.id).slice(-5),pop,uc,pl,base,'exp',x.id));if(dph>0.004)push(uctE(x.dat,'ND'+String(x.id).slice(-5),'DPH '+x.dph+' % '+(x.dod||''),'343',pl,dph,'exp',x.id));
  if((x.dph==='rcs'||x.dph==='rct')&&!(SUP.dphOd&&x.dat>=SUP.dphOd))push(uctE(x.dat,'ND'+String(x.id).slice(-5),'DPH samozdanenie 23 % bez odpočtu '+(x.dod||''),'548','343',Math.round(tot*23)/100,'exp',x.id))});
 // cestovné príkazy (uložené)
 CP.forEach(cp=>{const k=cpCalc(cp);const dat=(cp.uk||cp.na||'').slice(0,10);const pop=cp.no+' '+(cp.miesto||'')+' – '+(cp.ucel||'');
  push(uctE(dat,cp.no,'Stravné '+pop,'512','365',k.strav,'cp',cp.id));if(k.auto)push(uctE(dat,cp.no,'Náhrada za vozidlo '+pop,'512','365',k.auto,'cp',cp.id));

  if(+cp.pred)push(uctE((cp.na||'').slice(0,10),cp.no,'Preddavok na cestu '+cp.no,'365','221',+cp.pred,'cp',cp.id))});
 // kniha jázd (náhrady za vlastné vozidlo)
 JAZ.forEach(j=>{const n=nahrada(j);const dat=(j.od||'').slice(0,10);if(!dat)return;const v=VOZ[j.voz]||{};

 // dohodári – mesačne od mesiaca „od“ po „do“ (alebo aktuálny mesiac)

   push(uctE(dat,dok,'Odmena dohodár '+n,'521','331',c.o,'doh',d.id));if(c.er)push(uctE(dat,dok,'Odvody zamestnávateľa '+n,'524','336',c.er,'doh',d.id));

function uctRok(E,y){let n=0;return E.filter(e=>e.dat.slice(0,4)===String(y)).map(e=>Object.assign({},e,{c:++n}))}
function uctZost(E,to,from){const Z={};E.forEach(e=>{if(e.dat>to)return;if(from&&e.dat<from)return;(Z[e.md]=Z[e.md]||{md:0,d:0}).md+=e.suma;(Z[e.d]=Z[e.d]||{md:0,d:0}).d+=e.suma});return Z}
function uctTyp(a){return (OSN_MAP[a]||{}).t||(/^[0-4]/.test(a)?'A':/^5/.test(a)?'N':/^6/.test(a)?'V':'S')}
function uctVhMin(E,y){let v=0;const Zm=uctZost(E,(y-1)+'-12-31');Object.keys(Zm).forEach(a=>{const t=uctTyp(a);if(t==='V')v+=Zm[a].d-Zm[a].md;else if(t==='N')v-=Zm[a].md-Zm[a].d});return v} // VH minulých rokov (bez uzávierkových zápisov)
function uctHK(E,y){const from=y+'-01-01',to=y+'-12-31';const Z=uctZost(E,to),Zp=uctZost(E,(y-1)+'-12-31'),Zo=uctZost(E,to,from);
 const accs=Array.from(new Set([].concat(Object.keys(Z),Object.keys(Zo)))).sort();
 const R=accs.map(a=>{const p=Zp[a]||{md:0,d:0},o=Zo[a]||{md:0,d:0},k=Z[a]||{md:0,d:0};const t=uctTyp(a);
  const ps=(t==='N'||t==='V')?0:p.md-p.d;const ks=(t==='N'||t==='V')?o.md-o.d:k.md-k.d; // náklady/výnosy sa v novom roku začínajú od nuly
  return{a,n:(OSN_MAP[a]||{}).n||'(neznámy účet)',t,ps,omd:o.md,od:o.d,ks}}).filter(r=>Math.abs(r.ps)>0.004||r.omd>0.004||r.od>0.004);
 const vm=uctVhMin(E,y);if(Math.abs(vm)>0.004)R.push({a:'428/429',n:'Výsledok hospodárenia minulých rokov (automatický prenos)',t:'P',ps:-vm,omd:0,od:0,ks:-vm});

 R[4]=s(5,8);R[9]=s(10,13);R[2]=(R[3]||0)+R[4]+R[9];R[17]=s(18,20);R[21]=(R[22]||0)+(R[23]||0);R[14]=(R[15]||0)+(R[16]||0)+R[17]+R[21];R[1]=R[2]+R[14];

 h+=`<div class="card"><b>🇪🇺 Súhrnný výkaz (SVDPH) – ${lbl}</b><p class="mut">Služby s miestom dodania v inom členskom štáte (§ 15 ods. 1, reverse charge) – kód 2, hodnota v celých eurách. Do priznania k DPH sa tieto dodania neuvádzajú (miesto dodania mimo tuzemska).</p>${D.SV.length?'<table><thead><tr><th>Štát</th><th>IČ DPH odberateľa</th><th class="r">Kód</th><th class="r">Hodnota €</th></tr></thead><tbody>'+D.SV.map(s=>`<tr><td>${esc(s.k)}</td><td>${esc(s.ic)}</td><td class="r">${s.kod}</td><td class="r">${n0(s.v)}</td></tr>`).join('')+'</tbody></table>':'<p class="mut">žiadne dodania do EÚ – súhrnný výkaz sa za toto obdobie nepodáva</p>'}</div>`;
 h+=`<div class="card"><b>📘 Ako appka zaraďuje doklady</b><table><tbody><tr><td>Faktúra SK 23/19/5 %</td><td>r. 03/04 (01/02, 01a/02a), KV A.1; zálohová po úhrade (§ 19 ods. 4), riadna faktúra len rozdiel</td></tr><tr><td>Faktúra reverse charge (ČR/EÚ)</td><td>len súhrnný výkaz kód 2 podľa dátumu dodania</td></tr><tr><td>Dobropis</td><td>r. 24/25 so znamienkom, KV C.1</td></tr><tr><td>Náklad s DPH 23/19/5 %</td><td>r. 19/18/18a + r. 21/20/20a; KV B.2 (s číslom faktúry a IČ DPH dodávateľa) alebo B.3.1 (bloček / bez údajov)</td></tr><tr><td>Služba z EÚ / zahraničia (samozdanenie)</td><td>r. 09b/10b + odpočet r. 19, KV B.1; tovar z EÚ r. 07/08</td></tr><tr><td>Pred dňom registrácie</td><td>bez odpočtu (DPH je náklad); samozdanenie sa platí aj ako osoba § 7a</td></tr></tbody></table></div>`;
 $('s-dph').innerHTML=h}
function exportKVCSV(per){const D=dphObd(per);const R=[['Sekcia','IC_DPH','Cislo','Povodna','Datum','Zaklad','Dan','Sadzba','Odpocet']];
 D.KV.A1.forEach(r=>R.push(['A.1',r.ic,r.no,'',r.dt,r.z.toFixed(2),r.d.toFixed(2),r.s,'']));D.KV.B1.forEach(r=>R.push(['B.1',r.ic,r.no,'',r.dt,r.z.toFixed(2),r.d.toFixed(2),r.s,r.o.toFixed(2)]));D.KV.B2.forEach(r=>R.push(['B.2',r.ic,r.no,'',r.dt,r.z.toFixed(2),r.d.toFixed(2),r.s,r.o.toFixed(2)]));
 if(D.KV.B31.z||D.KV.B31.d)R.push(['B.3.1','','','','',D.KV.B31.z.toFixed(2),D.KV.B31.d.toFixed(2),'',D.KV.B31.o.toFixed(2)]);D.KV.C1.forEach(r=>R.push(['C.1',r.ic,r.no,r.ref,'',r.z.toFixed(2),r.d.toFixed(2),r.s,'']));
 D.SV.forEach(s=>R.push(['SV',s.ic,'','','',String(s.v),'',String(s.kod),'']));
 dl('Practeo_KV_DPH_'+per+'.csv','﻿'+R.map(r=>r.map(csvEsc).join(';')).join('\n'),'text/csv');toast('Export KV ✅')}
function dphPrint(per){const D=dphObd(per);const R=D.R;const lbl=per.slice(5,7)+'/'+per.slice(0,4);const hd=`<div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:6px"><div><b>${esc(SUP.meno)}</b><br>${esc(SUP.sidlo)}<br>IČO ${esc(SUP.ico)} · DIČ ${esc(SUP.dic)} · IČ DPH ${esc(SUP.icdph)}</div><div style="text-align:right">Zdaňovacie obdobie ${lbl}<br>podklad z Practeo Admin, ${new Date().toLocaleDateString('sk-SK')}</div></div>`;
 const rows=DPH_ROWS.filter(([r])=>Math.abs(R[r]||0)>0.004||['17','32','33'].includes(r)).map(([r,t])=>`<tr><td class="r">${r}</td><td>${esc(t)}</td><td class="r">${n2(R[r]||0)}</td></tr>`).join('');
 const L=(arr,hdr)=>arr.length?'<table style="width:100%"><thead><tr>'+hdr.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+arr.map(r=>`<tr><td>${esc(r.ic)}</td><td>${esc(r.no)}${r.ref?' / '+esc(r.ref):''}</td><td>${esc(r.dt||'')}</td><td class="r">${n2(r.z)}</td><td class="r">${n2(r.d)}</td><td class="r">${esc(r.s)}</td><td class="r">${r.o!=null?n2(r.o):''}</td></tr>`).join('')+'</tbody></table>':'<div style="font-size:11px">žiadne</div>';
 const H=['IČ DPH','Číslo','Dátum','Základ','Daň','%','Odpočet'];
 $('print').innerHTML=`<div class="inv"><h2>Daňové priznanie k DPH – podklad (DPHv25)</h2>${hd}<table style="width:100%"><thead><tr><th>r.</th><th style="text-align:left">Položka</th><th class="r">€</th></tr></thead><tbody>${rows}</tbody></table>
  <h2 style="margin-top:16px">Kontrolný výkaz – podklad</h2><h3 style="font-size:12px;margin:8px 0 2px">A.1.</h3>${L(D.KV.A1,H)}<h3 style="font-size:12px;margin:8px 0 2px">B.1.</h3>${L(D.KV.B1,H)}<h3 style="font-size:12px;margin:8px 0 2px">B.2.</h3>${L(D.KV.B2,H)}
  <h3 style="font-size:12px;margin:8px 0 2px">B.3.1.</h3><div style="font-size:11px">základ ${n2(D.KV.B31.z)} · daň ${n2(D.KV.B31.d)} · odpočet ${n2(D.KV.B31.o)}</div><h3 style="font-size:12px;margin:8px 0 2px">C.1.</h3>${L(D.KV.C1,H)}
  <h2 style="margin-top:16px">Súhrnný výkaz – podklad</h2>${D.SV.length?'<table style="width:100%"><thead><tr><th>Štát</th><th>IČ DPH</th><th>Kód</th><th class="r">Hodnota €</th></tr></thead><tbody>'+D.SV.map(s=>`<tr><td>${esc(s.k)}</td><td>${esc(s.ic)}</td><td>${s.kod}</td><td class="r">${n0(s.v)}</td></tr>`).join('')+'</tbody></table>':'<div style="font-size:11px">nepodáva sa</div>'}
  ${D.W.length?'<div style="font-size:10px;margin-top:8px"><b>Upozornenia:</b> '+D.W.map(esc).join('; ')+'</div>':''}
  <div style="font-size:10px;margin-top:8px">Podklad na prepis do eDane (DPHv25, KVDPHv25, SVDPH). Zdroje: poučenie MF SR č. MF/007833/2025-731 (priznanie), opatrenie MF/015393/2020-731 + dodatok MF/018205/2024-731 (KV). Pred podaním skontroluje účtovník.</div></div>`;
 window.print()}
